[project]
name = "cbng-trainer"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "click (>=8.5.0,<9.0.0)",
    "kubernetes (>=37.0.2,<38.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "aiohttp (>=3.14.5,<4.0.0)",
    "aiohttp-retry (>=2.9.1,<3.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
]

[tool.poetry.group.test.dependencies]
tox = "^4.67.12"
tox-current-env = "^0.0.17"
black = "^26.10.1"
ruff = "^0.17.4"
bandit = "^1.9.4"

[tool.ruff]
exclude = ['*/migrations/*', 've/*', '.tox/*']
line-length = 120

[tool.black]
line-length = 120
extend-exclude = '''
(
  ^/ve
)
'''

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
